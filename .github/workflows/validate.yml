name: Validate enterprise release
on:
  pull_request:
  push:
    branches: [main, feat/enterprise-access]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx --yes firebase-tools emulators:exec --only firestore --project demo-utt-enterprise "npm run test:rules"
